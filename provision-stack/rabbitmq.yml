---
- name: Install & Setup RabbitMQ with user
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Install dependencies
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - curl
        - gnupg
        - apt-transport-https
        - software-properties-common
        - erlang
      tags: package

    - name: Add RabbitMQ public signing key
      apt_key:
        url: https://github.com/rabbitmq/signing-keys/releases/download/2.0/rabbitmq-release-signing-key.asc
        state: present
      tags: package

    - name: Add RabbitMQ APT repository
      apt_repository:
        repo: deb https://dl.cloudsmith.io/public/rabbitmq/rabbitmq-server/deb/ubuntu jammy main
        state: present
        filename: rabbitmq
      when: ansible_distribution_release == "jammy"
      tags: package

    - name: Add RabbitMQ APT repository (Ubuntu 24.04 - noble)
      apt_repository:
        repo: deb https://dl.cloudsmith.io/public/rabbitmq/rabbitmq-server/deb/ubuntu noble main
        state: present
        filename: rabbitmq
      when: ansible_distribution_release == "noble"
      tags: package

    - name: Install RabbitMQ server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes
      tags: package

    - name: Start & enable RabbitMQ
      service:
        name: rabbitmq-server
        state: started
        enabled: yes
      tags: svc

    - name: Allow guest access remotely (disable loopback_users)
      copy:
        content: |
          [{rabbit, [{loopback_users, []}]}].
        dest: /etc/rabbitmq/rabbitmq.config
      notify: Restart RabbitMQ
      tags: conf

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RabbitMQ
      tags: conf

    - name: Enable RabbitMQ management plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RabbitMQ
      tags: plugin

  handlers:
    - name: Restart RabbitMQ
      service:
        name: rabbitmq-server
        state: restarted