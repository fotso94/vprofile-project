---
- name: Install & Setup RabbitMQ with user (Ubuntu 22.04 Compatible)
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required dependencies
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Remove any existing RabbitMQ repositories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/rabbitmq.list
        - /etc/apt/sources.list.d/rabbitmq-server.list
      ignore_errors: yes

    - name: Install Erlang from Ubuntu repositories (base packages)
      apt:
        name:
          - erlang-base
          - erlang-crypto
          - erlang-eldap
          - erlang-inets
          - erlang-mnesia
          - erlang-os-mon
          - erlang-parsetools
          - erlang-public-key
          - erlang-runtime-tools
          - erlang-ssl
          - erlang-syntax-tools
          - erlang-tools
          - erlang-xmerl
        state: present
        update_cache: yes

    - name: Download compatible RabbitMQ version (3.8.x series)
      get_url:
        url: "https://github.com/rabbitmq/rabbitmq-server/releases/download/v3.8.34/rabbitmq-server_3.8.34-1_all.deb"
        dest: /tmp/rabbitmq-server.deb
        mode: '0644'
        timeout: 30

    - name: Install RabbitMQ from downloaded package (force dependencies)
      shell: |
        dpkg -i --force-depends /tmp/rabbitmq-server.deb || true
        apt-get install -f -y
      register: rabbitmq_install
      ignore_errors: yes

    - name: Check if RabbitMQ was installed successfully
      shell: dpkg -l | grep rabbitmq-server
      register: rabbitmq_check
      ignore_errors: yes

    - name: Show installation result
      debug:
        msg: "RabbitMQ installation: {{ 'SUCCESS' if rabbitmq_check.rc == 0 else 'FAILED' }}"

    - name: Install RabbitMQ Server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes


    - name: Start & Enable RabbitMQ service
      systemd:
        name: rabbitmq-server
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for RabbitMQ to be ready
      wait_for:
        port: 5672
        host: localhost
        delay: 5
        timeout: 60

    - name: Configure RabbitMQ (modern format)
      copy:
        content: |
          # Allow remote connections
          loopback_users = none

          # Enable management plugin
          management.tcp.port = 15672
          management.tcp.ip = 0.0.0.0
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Enable RabbitMQ management plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      systemd:
        name: rabbitmq-server
        state: restarted