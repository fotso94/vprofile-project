---
- name: Install RabbitMQ Standalone with bundled Erlang
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Install required dependencies
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - software-properties-common
        update_cache: yes

    - name: Add Erlang Solutions GPG key
      apt_key:
        url: https://packages.erlang-solutions.com/ubuntu/erlang_solutions.asc
        state: present

    - name: Add Erlang Solutions repository
      apt_repository:
        repo: "deb https://packages.erlang-solutions.com/ubuntu jammy contrib"
        state: present
        filename: erlang-solutions

    - name: Install Erlang
      apt:
        name: esl-erlang
        update_cache: yes
        state: present

    - name: Add RabbitMQ GPG key
      apt_key:
        url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
        state: present

    - name: Add RabbitMQ repository
      apt_repository:
        repo: "deb https://ppa1.novemberain.com/rabbitmq/rabbitmq-server/deb/ubuntu jammy main"
        state: present
        filename: rabbitmq

    - name: Install RabbitMQ Server
      apt:
        name: rabbitmq-server
        update_cache: yes
        state: present

    - name: Enable and start RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ to allow external access (disable loopback_users)
      copy:
        content: |
          loopback_users = none
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

    - name: Enable RabbitMQ Management Plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted