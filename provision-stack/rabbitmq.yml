---
- name: Install RabbitMQ compatible with Ubuntu 22.04
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  vars:
    rabbitmq_version: "3.8.34"
    rabbitmq_deb_url: "https://github.com/rabbitmq/rabbitmq-server/releases/download/v{{ rabbitmq_version }}/rabbitmq-server_{{ rabbitmq_version }}-1_all.deb"

  tasks:
    - name: Remove any existing RabbitMQ packages
      apt:
        name: rabbitmq-server
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Clean package cache
      apt:
        autoclean: yes
        autoremove: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Erlang from Ubuntu repositories
      apt:
        name:
          - erlang-nox
          - erlang-mnesia
          - erlang-os-mon
          - erlang-eldap
          - erlang-crypto
          - erlang-inets
          - erlang-parsetools
          - erlang-public-key
          - erlang-runtime-tools
          - erlang-ssl
          - erlang-syntax-tools
          - erlang-tools
          - erlang-xmerl
        state: present

    - name: Download compatible RabbitMQ version
      get_url:
        url: "{{ rabbitmq_deb_url }}"
        dest: /tmp/rabbitmq-server.deb
        mode: '0644'

    - name: Install RabbitMQ from downloaded package
      apt:
        deb: /tmp/rabbitmq-server.deb
        state: present

    - name: Enable and start RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ to allow external access (disable loopback_users)
      copy:
        content: |
          loopback_users = none
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

    - name: Enable RabbitMQ Management Plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted