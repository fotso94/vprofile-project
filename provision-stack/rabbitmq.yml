---
- name: Install & Setup RabbitMQ with user
  hosts: rmqsrvgrp
  become: yes
  gather_facts: no

  tasks:
    - name: Add Erlang Solutions GPG key
      apt_key:
        url: https://packages.erlang-solutions.com/ubuntu/erlang_solutions.asc
        state: present
      tags: [package]

    - name: Add Erlang Solutions APT repository
      apt_repository:
        repo: "deb https://packages.erlang-solutions.com/ubuntu jammy contrib"
        state: present
        filename: erlang
      tags: [package]

    - name: Add RabbitMQ signing key
      apt_key:
        url: https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey
        state: present
      tags: [package]

    - name: Add RabbitMQ APT repository
      apt_repository:
        repo: "deb https://packagecloud.io/rabbitmq/rabbitmq-server/ubuntu/ jammy main"
        state: present
        filename: rabbitmq
      tags: [package]

    - name: Install Erlang and RabbitMQ
      apt:
        name:
          - esl-erlang
          - rabbitmq-server
        update_cache: yes
        cache_valid_time: 86400
        state: present
      tags: [package]

    - name: Start & Enable RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes
      tags: [svc]

    - name: Configure RabbitMQ (disable loopback_users)
      copy:
        content: |
          [{rabbit, [{loopback_users, []}]}].
        dest: /etc/rabbitmq/rabbitmq.config
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ
      tags: [conf]

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ
      tags: [conf]

    - name: Enable rabbitmq_management plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ
      tags: [package]

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted