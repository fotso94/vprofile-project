---
- name: Install RabbitMQ with Ubuntu packages
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Erlang and RabbitMQ from Ubuntu repositories
      apt:
        name:
          - erlang-nox
          - erlang-mnesia
          - erlang-os-mon
          - erlang-eldap
          - rabbitmq-server
        state: present

    - name: Enable and start RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ to allow external access (disable loopback_users)
      copy:
        content: |
          loopback_users = none
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

    - name: Enable RabbitMQ Management Plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted