---
- name: Install RabbitMQ Standalone with bundled Erlang
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  vars:
    rabbitmq_deb_url: https://github.com/rabbitmq/rabbitmq-server/releases/download/v3.12.12/rabbitmq-server_3.12.12-1_all.deb

  tasks:
    - name: Install required dependencies
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        update_cache: yes

    - name: Download RabbitMQ .deb package with bundled Erlang
      get_url:
        url: "{{ rabbitmq_deb_url }}"
        dest: /tmp/rabbitmq-server.deb

    - name: Install RabbitMQ using dpkg
      apt:
        deb: /tmp/rabbitmq-server.deb
        state: present

    - name: Enable and start RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ to allow external access (disable loopback_users)
      copy:
        content: |
          [{rabbit, [{loopback_users, []}]}].
        dest: /etc/rabbitmq/rabbitmq.config
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

    - name: Enable RabbitMQ Management Plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted