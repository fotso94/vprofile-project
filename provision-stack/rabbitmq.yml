---
- name: Install & Setup RabbitMQ with user (Ubuntu 22.04 Compatible)
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required dependencies
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Add RabbitMQ signing key (Cloudsmith official)
      get_url:
        url: https://dl.cloudsmith.io/public/rabbitmq/rabbitmq-server/gpg.key
        dest: /usr/share/keyrings/rabbitmq-archive-keyring.gpg
        mode: '0644'

    - name: Add RabbitMQ APT repository (Ubuntu 22.04 - jammy)
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/rabbitmq-archive-keyring.gpg] https://dl.cloudsmith.io/public/rabbitmq/rabbitmq-server/deb/ubuntu jammy main"
        state: present
        filename: rabbitmq

    - name: Install Erlang from Ubuntu repositories
      apt:
        name:
          - erlang-base
          - erlang-asn1
          - erlang-crypto
          - erlang-eldap
          - erlang-ftp
          - erlang-inets
          - erlang-mnesia
          - erlang-os-mon
          - erlang-parsetools
          - erlang-public-key
          - erlang-runtime-tools
          - erlang-snmp
          - erlang-ssl
          - erlang-syntax-tools
          - erlang-tftp
          - erlang-tools
          - erlang-xmerl
        state: present
        update_cache: yes

    - name: Install RabbitMQ Server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes

    - name: Start & Enable RabbitMQ service
      systemd:
        name: rabbitmq-server
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for RabbitMQ to be ready
      wait_for:
        port: 5672
        host: localhost
        delay: 5
        timeout: 60

    - name: Configure RabbitMQ (rabbitmq.conf)
      copy:
        content: |
          loopback_users = none
          management.tcp.port = 15672
          management.tcp.ip = 0.0.0.0
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Enable RabbitMQ management plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      systemd:
        name: rabbitmq-server
        state: restarted