---
- name: Install & Setup RabbitMQ with user (Ubuntu 22.04 Compatible)
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required dependencies
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Remove any existing RabbitMQ repositories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/rabbitmq.list
        - /etc/apt/sources.list.d/rabbitmq-server.list
      ignore_errors: yes

    - name: Add RabbitMQ Team GPG key (Cloudsmith)
      apt_key:
        keyserver: keyserver.ubuntu.com
        id: 9F4587F226208342
        state: present

    - name: Add RabbitMQ main signing key
      apt_key:
        url: https://github.com/rabbitmq/signing-keys/releases/download/2.0/rabbitmq-release-signing-key.asc
        state: present

    - name: Add RabbitMQ repository (Cloudsmith - official)
      apt_repository:
        repo: "deb https://dl.cloudsmith.io/public/rabbitmq/rabbitmq-server/deb/ubuntu jammy main"
        state: present
        filename: rabbitmq-server
        update_cache: no

    - name: Update apt cache after adding repository
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install Erlang from Ubuntu repositories (compatible version)
      apt:
        name:
          - erlang-base
          - erlang-asn1
          - erlang-crypto
          - erlang-eldap
          - erlang-ftp
          - erlang-inets
          - erlang-mnesia
          - erlang-os-mon
          - erlang-parsetools
          - erlang-public-key
          - erlang-runtime-tools
          - erlang-snmp
          - erlang-ssl
          - erlang-syntax-tools
          - erlang-tftp
          - erlang-tools
          - erlang-xmerl
        state: present
        update_cache: yes

    - name: Install RabbitMQ Server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes


    - name: Start & Enable RabbitMQ service
      systemd:
        name: rabbitmq-server
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for RabbitMQ to be ready
      wait_for:
        port: 5672
        host: localhost
        delay: 5
        timeout: 60

    - name: Configure RabbitMQ (modern format)
      copy:
        content: |
          # Allow remote connections
          loopback_users = none

          # Enable management plugin
          management.tcp.port = 15672
          management.tcp.ip = 0.0.0.0
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Enable RabbitMQ management plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      systemd:
        name: rabbitmq-server
        state: restarted