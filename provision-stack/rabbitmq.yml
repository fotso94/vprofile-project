---
- name: Install RabbitMQ using snap package
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  tasks:
    - name: Remove any existing RabbitMQ packages
      apt:
        name: rabbitmq-server
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Clean package cache
      apt:
        autoclean: yes
        autoremove: yes

    - name: Install snapd if not present
      apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Install RabbitMQ via snap
      snap:
        name: rabbitmq-server
        state: present

    - name: Wait for RabbitMQ to be ready
      wait_for:
        port: 5672
        host: localhost
        delay: 10
        timeout: 60

    - name: Enable RabbitMQ management plugin
      shell: |
        snap run rabbitmq-server.rabbitmq-plugins enable rabbitmq_management
      ignore_errors: yes

    - name: Enable and start RabbitMQ service
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ to allow external access (disable loopback_users)
      copy:
        content: |
          loopback_users = none
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart RMQ

    - name: Create RabbitMQ admin user
      rabbitmq_user:
        user: test
        password: test
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        tags: administrator
        state: present
      notify: Restart RMQ

    - name: Enable RabbitMQ Management Plugin
      rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted