- name: Install & Setup RabbitMQ with user
  hosts: rmqsrvgrp
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Add Erlang public key
      apt_key:
        url: https://packages.erlang-solutions.com/ubuntu/erlang_solutions.asc
        state: present

    - name: Add Erlang repository
      apt:
        deb: https://packages.erlang-solutions.com/erlang-solutions_1.0_all.deb
        state: present

    - name: Add RabbitMQ public key
      apt_key:
        url: https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey
        state: present

    - name: Add RabbitMQ repository
      apt_repository:
        repo: "deb https://packagecloud.io/rabbitmq/rabbitmq-server/ubuntu/ jammy main"
        state: present
        filename: rabbitmq

    - name: Update apt cache
      apt:
        update_cache: yes

  tasks:
    - name: Install Erlang and RabbitMQ
      apt:
        name:
          - erlang
          - rabbitmq-server
        state: present

    - name: Start and enable RabbitMQ
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Configure RabbitMQ (sysctl-style)
      copy:
        content: |
          loopback_users.guest = false
        dest: /etc/rabbitmq/rabbitmq.conf
      notify: Restart RMQ

    - name: Enable management plugin
      community.rabbitmq.rabbitmq_plugin:
        names: rabbitmq_management
        state: enabled
      notify: Restart RMQ

    - name: Create RabbitMQ user
      community.rabbitmq.rabbitmq_user:
        user: test
        password: test
        tags: administrator
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
      notify: Restart RMQ

  handlers:
    - name: Restart RMQ
      service:
        name: rabbitmq-server
        state: restarted